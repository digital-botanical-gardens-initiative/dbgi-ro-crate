name: data
type: table
path: ./data.csv
scheme: file
format: csv
mediatype: text/csv
encoding: utf-8
schema:
  fields:
    - name: Date
      type: date
      # required: true
    - name: Minimum temperature (°C)
      type: number
      rdfType: http://purl.obolibrary.org/obo/AGRO_00000627
    - name: Maximum temperature (°C)
      type: number
    - name: Rainfall (mm)
      type: number
    - name: Station ID
      type: integer
  missingValues:
    - ""
    - n/a
